# Build with Vite → dist/, then copy those files to the REPO ROOT on main.
# GitHub Pages for username.github.io usually serves / (root), not /docs — so the live site
# must be index.html + assets/ at the top level of the branch.
#
# Runs on tag push: v1.0.0, v2.3.1, …
#   git tag v1.0.1 && git push origin v1.0.1
#
# Settings → Actions → Workflow permissions: Read and write.

name: Build and deploy to main (site root)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: deploy-pages-root
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: SPA fallback (GitHub Pages)
        run: cp dist/index.html dist/404.html

      - name: Copy dist to repo root on main
        run: |
          set -e
          cp -R dist /tmp/site-build
          git reset --hard HEAD
          if [ -d dist ]; then git clean -fd dist; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main --rebase

          # Remove previous static site at repo root (old GitHub Pages deploy)
          rm -rf assets
          rm -f index.html 404.html vite.svg favicon.ico favicon.svg favicon-96x96.png \
            apple-touch-icon.png site.webmanifest web-app-manifest-192x192.png \
            web-app-manifest-512x512.png

          # Remove old /docs site if present (Pages was serving root, not /docs)
          if [ -d docs ]; then
            git rm -rf docs 2>/dev/null || rm -rf docs
          fi

          cp -r /tmp/site-build/. .

          echo "=== root after deploy copy ==="
          ls -la

          # Stage everything Vite put in dist (HTML, assets/, favicons, manifest, etc.)
          (cd /tmp/site-build && find . -type f) | sed 's|^\./||' | while IFS= read -r f; do
            git add -f "$f"
          done

          echo "=== git status ==="
          git status
          echo "=== staged diff ==="
          git diff --cached --stat || true

          if git diff --staged --quiet; then
            echo "::warning::No staged changes (build may match root already)."
            exit 0
          fi

          git commit -m "chore: deploy site [skip ci]"
          git push origin HEAD:main
          git log -1 --oneline
